name: Integration

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Live sources
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - run: mix deps.get

      - run: mix test --only integration
