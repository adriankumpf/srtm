name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MIX_ENV: test

    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.20"
            otp: "29"
            lint: true
          # oldest pair allowed by `elixir: "~> 1.15"` in mix.exs
          - elixir: "1.15"
            otp: "25"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache compiled build and deps
        id: cache-build
        uses: actions/cache@v6
        env:
          cache-name: cache-compiled-build-and-deps
        with:
          path: |
            _build
            deps
          key: ${{ runner.os }}-mix-${{ env.cache-name }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.cache-name }}-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mix deps.get

      - run: mix format --check-formatted
        if: matrix.lint

      - run: mix deps.unlock --check-unused
        if: matrix.lint

      - run: mix deps.compile

      - run: mix compile --warnings-as-errors
        if: matrix.lint

      - run: mix test
